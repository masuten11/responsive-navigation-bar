<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Responsive Header</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.25s ease-in;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: hsl(0, 0%, 6%);
      color: whitesmoke;
      text-align: center;
    }

    .container {
      margin-top: 15rem;
      padding: 2rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .container div {
      max-width: 40px;
      flex: 1 1 auto;
    }

    img {
      max-width: 100%;
      height: auto;
      opacity: 0.45;
      display: block;
    }

    a {
      color: whitesmoke;
      text-decoration: none;
    }

    header {
      padding: 1rem 2.1rem 0 2.4rem;
      height: 3.8rem;
      border-bottom: 2px solid hsl(0, 0%, 30%);
      background-color: hsl(0, 0%, 100%, 0.035);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
    }

    #logo {
      padding: 0.3rem;
      margin-top: -0.35rem;
      display: flex;
      gap: 0.33rem;
      align-items: center;
      justify-content: center;
    }

    #logo img {
      height: 2rem;
      width: auto;
      display: block;
    }

    #logo h4 {
      opacity: 0.9;
    }

    nav {
      height: 100%;
      width: auto;
    }

    nav>ul,
    #product-sub-list,
    #resource-sub-list {
      list-style: none;
    }

    nav>ul {
      display: flex;
      gap: 0.77rem;
      align-items: flex-start;
      justify-content: center;
    }

    nav>ul>li {
      padding: 0.4rem;
      text-align: start;
      transition: all 300ms ease-in-out;
      position: relative;
    }

    #product-sub-list>li,
    #resource-sub-list>li {
      padding: 0.43rem 1.55rem 0.43rem 0.43rem;
      letter-spacing: -0.3px;
      border-bottom: 1px solid darkgray;
      display: flex;
      gap: 0.22rem;
      align-items: center;
      justify-content: flex-start;
    }

    #product-sub-list>li:last-of-type,
    #resource-sub-list>li:last-of-type {
      border-bottom: none;
    }

    #product-sub-list>li>img,
    #resource-sub-list>li>img {
      height: 1rem;
      width: auto;
      opacity: 0.5;
      display: inline;
      align-self: center;
    }

    #product-sub-list,
    #resource-sub-list {
      display: none;
      opacity: 0;
      background-color: hsl(0, 0%, 17%);
      margin-top: 1.5rem;
      border-radius: 10px;
      transition: all 300ms ease-in-out;
      position: absolute;
      z-index: 100;
    }

    #menu-bar {
      height: 2.3rem;
      margin-top: -10%;
      width: auto;
      display: none;
      cursor: pointer;
    }

    #menu-list ul {
      display: none;
      position: absolute;
      top: 3.8rem;
      right: 0;
      list-style-type: none;
      background-color: hsl(0, 0%, 17%);
      border-radius: 4px;
      min-width: 120px;
      z-index: 200;
    }

    #menu-list.active ul {
      display: block;
    }

    #menu-list>ul>li {
      position: relative;
      padding: 0.3rem 0.3rem;
      text-align: center;
      border-bottom: 1px solid hsl(0, 0%, 36%);
      position: relative;
    }

    #menu-list>ul>li:last-child {
      border-bottom: none;
    }

    #menu-list ul>li>a {
      color: whitesmoke;
      display: block;
      width: 100%;
    }


    #menu-list>ul>li:hover>ul {
      display: block;
    }

    /* Animatons & Transitions */
    nav>ul>li:first-of-type:hover #product-sub-list {
      display: block;
      opacity: 1;
    }

    nav>ul>li:nth-of-type(2):hover #resource-sub-list {
      display: block;
      opacity: 1;
    }

    /* Responsiveness */
    @media (width < 800px) {

      nav>ul>li:nth-of-type(3),
      nav>ul>li:nth-of-type(4),
      nav>ul>li:nth-of-type(5) {
        display: none;
      }

      #menu-bar {
        display: block;
      }
    }

    @media (width < 535px) {

      nav>ul>li:nth-of-type(1),
      nav>ul>li:nth-of-type(2) {
        display: none;
      }

      .container div {
        max-width: 33px;
      }
    }

    @media (width < 500px) {
      header {
        padding-inline: 1.1rem 1.2rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <div id="logo">
      <img src="/Media/apple.png" alt="apple-logo">
      <h4>Apple</h4>
    </div>

    <nav>
      <ul>
        <li><a href="#">Products +</a>
          <ul id="product-sub-list">
            <li><img src="/Media/rectangle.png" alt=""><a href="#"> Smartphone</a></li>
            <li><img src="/Media/circle.png" alt=""><a href="#"> Mac</a></li>
            <li><img src="/Media/bleach.png" alt=""><a href="#"> Tablet</a></li>
          </ul>
        </li>

        <li><a href="#">Resources +</a>
          <ul id="resource-sub-list">
            <li><img src="/Media/circle.png" alt=""><a href="#"> Blogs</a></li>
            <li><img src="/Media/bleach.png" alt=""><a href="#"> Tutorials</a></li>
            <li><img src="/Media/circle.png" alt=""><a href="#"> Documentations</a></li>
          </ul>
        </li>

        <li><a href="#">Developers</a></li>
        <li><a href="#">Price</a></li>
        <li><a href="#">Help</a></li>

        <li id="menu-list"><img id="menu-bar" src="/Media/menu.png" alt="menu">
          <ul>
            <li><a href="#">Products +</a></li>
            <li><a href="#">Resources +</a></li>
            <li><a href="#">Developers</a></li>
            <li><a href="#">Price</a></li>
            <li><a href="#">Help</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <div><img src="/Media/circle.png" alt="circle-icon"></div>
      <div><img src="/Media/bleach.png" alt="rectangle-icon"></div>
      <div><img src="/Media/rectangle.png" alt="bleach-icon"></div>
    </div>
  </main>

  <script>
    // Toggle mobile menu
    document.getElementById('menu-bar').addEventListener('click', function () {
      document.getElementById('menu-list').classList.toggle('active');
    });

    // Close menu when clicking outside
    document.addEventListener('click', function (event) {
      const menuList = document.getElementById('menu-list');
      const menuBar = document.getElementById('menu-bar');

      if (!menuList.contains(event.target) && event.target !== menuBar) {
        menuList.classList.remove('active');
      }
    });
  </script>
</body>

</html>
